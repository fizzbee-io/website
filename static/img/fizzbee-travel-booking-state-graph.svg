<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">FizzBee state graph for travel_booking.fizz</title>
  <desc id="desc">Three FizzBee states from the error graph: Init, Coordinator Checkout, and crash.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f7d63"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#16201c" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="0" fill="#f6f8f4"/>
  <path d="M0 72 H960 M0 144 H960 M0 216 H960 M0 288 H960 M0 360 H960 M0 432 H960 M120 0 V540 M240 0 V540 M360 0 V540 M480 0 V540 M600 0 V540 M720 0 V540 M840 0 V540" stroke="#dce4dd" stroke-width="1" opacity="0.68"/>
  <g fill="none" stroke="#2f7d63" stroke-width="4" marker-end="url(#arrow)">
    <path d="M288 270 C338 214 394 214 444 270"/>
    <path d="M612 270 C662 326 718 326 768 270"/>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <g filter="url(#shadow)">
      <rect x="72" y="176" width="216" height="188" rx="8" fill="#ffffff" stroke="#b8c8bd" stroke-width="2"/>
      <rect x="72" y="176" width="216" height="42" rx="8" fill="#eaf6ef"/>
      <text x="96" y="204" fill="#16201c" font-size="18" font-weight="800">Init</text>
      <text x="96" y="250" fill="#2d3d35" font-size="15" font-weight="700">Coordinator#0</text>
      <text x="96" y="274" fill="#58645f" font-size="14">status = init</text>
      <text x="96" y="312" fill="#2d3d35" font-size="15" font-weight="700">Participant#0, #1</text>
      <text x="96" y="336" fill="#58645f" font-size="14">status = init</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="372" y="146" width="248" height="248" rx="8" fill="#ffffff" stroke="#b8c8bd" stroke-width="2"/>
      <rect x="372" y="146" width="248" height="42" rx="8" fill="#fff2d8"/>
      <text x="396" y="174" fill="#16201c" font-size="18" font-weight="800">Coordinator#0.Checkout</text>
      <text x="396" y="220" fill="#2d3d35" font-size="15" font-weight="700">Coordinator#0</text>
      <text x="396" y="244" fill="#58645f" font-size="14">status = inprogress</text>
      <text x="396" y="282" fill="#2d3d35" font-size="15" font-weight="700">Participant#0, #1</text>
      <text x="396" y="306" fill="#58645f" font-size="14">status = init</text>
      <text x="396" y="350" fill="#8a5a12" font-size="14" font-family="JetBrains Mono, monospace">threads: 0/1</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="732" y="176" width="156" height="188" rx="8" fill="#ffffff" stroke="#d9a68f" stroke-width="2"/>
      <rect x="732" y="176" width="156" height="42" rx="8" fill="#f8eee9"/>
      <text x="756" y="204" fill="#16201c" font-size="18" font-weight="800">crash</text>
      <text x="756" y="250" fill="#2d3d35" font-size="15" font-weight="700">Coordinator#0</text>
      <text x="756" y="274" fill="#b75a32" font-size="14">status = inprogress</text>
      <text x="756" y="312" fill="#2d3d35" font-size="15" font-weight="700">Participants</text>
      <text x="756" y="336" fill="#58645f" font-size="14">status = init</text>
    </g>
    <text x="40" y="500" fill="#58645f" font-size="14" font-family="JetBrains Mono, monospace">error-graph.dot from fizz --output-dir /tmp/fizzbee-home-run travel_booking.fizz</text>
  </g>
</svg>
