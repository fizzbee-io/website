baseURL = 'https://fizzbee.io'
languageCode = 'en-us'
title = 'FizzBee'

theme = "hugo-geekdoc"

pluralizeListTitles = false

# Geekdoc required configuration
pygmentsUseClasses = true
pygmentsCodeFences = true
disablePathToLower = true

# Required if you want to render robots.txt template
enableRobotsTXT = true

# Sitemap <lastmod> comes from each file's last git commit. Needs full git
# history at build time: a shallow clone gives every page the same date.
enableGitInfo = true

[params]
  geekdocLogo = "bee-left-to-right-512x512.png"
  geekdocPrivacyPolicy = "/privacy.html"
  geekdocTagsToMenu = false
  # Default og:image / twitter:image for pages without their own featured image.
  images = ["social-card.png"]

# Needed for mermaid shortcodes
[markup]
  [markup.goldmark.renderer]
    # Needed for mermaid shortcode or when nesting shortcodes (e.g. img within
    # columns or tabs)
    unsafe = true
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 9

[taxonomies]
   tag = "tags"

